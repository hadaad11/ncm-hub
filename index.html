<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NCM Hub</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="NCM Hub">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f6f9;--card:#fff;--txt:#14212e;--mut:#6b7785;--line:#e1e7ee;--acc:#006ca8;--acc2:#24a854;--ok:#1d8f47;--bad:#c0352b;--bar:#006ca8;--soft:#e8f2f9}
@media (prefers-color-scheme:dark){:root{--bg:#0d1823;--card:#152536;--txt:#e3eaf1;--mut:#9aa8b6;--line:#26394c;--acc:#3a9bd9;--acc2:#3cc26c;--ok:#3cc26c;--bar:#3a9bd9;--soft:#1b3247}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
.hidden{display:none!important}
/* lock screen */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#lock form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;width:100%;max-width:340px}
#lock h1{margin:0 0 4px;font-size:22px}
#lock p{margin:0 0 18px;color:var(--mut);font-size:13px}
#lock input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#lock label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);margin:12px 0 16px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
#err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
/* app */
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
/* NCM brand bar - same as the Manpower page: white, logo left, green rule */
.topbar{background:#fff;border-bottom:3px solid #24a854;padding:10px 16px}
.topbar .tb{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1200px;margin:0 auto}
.topbar img{height:40px;width:auto;display:block}
.topbar span{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#6b7785}
@media (max-width:600px){.topbar img{height:32px}.topbar span{display:none}}
.lock-logo{background:#fff;border-radius:12px;padding:12px;margin:-6px -4px 18px;border-bottom:3px solid #24a854;text-align:center}
.lock-logo img{height:48px;max-width:100%}
/* left sidebar with the tabs; on phones it slides in from the left behind the ☰ button */
.layout{display:flex;align-items:flex-start}
.side{position:sticky;top:var(--hdr,63px);height:calc(100vh - var(--hdr,63px));width:220px;flex:0 0 220px;
  background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
nav#tabs{display:flex;flex-direction:column;gap:3px}
nav#tabs button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;
  padding:10px 12px;cursor:pointer;color:var(--mut);font-weight:600;font-size:14px}
nav#tabs button i{font-style:normal;width:22px;text-align:center}
nav#tabs button:hover{background:var(--soft);color:var(--txt)}
nav#tabs button.on{background:var(--acc);color:#fff;box-shadow:inset 4px 0 0 var(--acc2)}
.side-f{margin-top:auto;padding:12px 4px 0;border-top:1px solid var(--line)}
.side-f small{display:block;color:var(--mut);font-size:12px;margin-bottom:8px}
.side-b{display:flex;gap:6px}.side-b .btn{flex:1;padding:8px 10px;font-size:13px}
main{flex:1;min-width:0;max-width:1200px;padding:16px 20px}
.burger{display:none;background:none;border:1px solid #d6dbe3;border-radius:9px;padding:4px 10px;font-size:18px;cursor:pointer;color:#334155}
.scrim{display:none}
.topbar .tb{justify-content:flex-start}
.topbar .tb span{margin-left:auto}
@media (max-width:860px){
  .burger{display:block}
  .side{position:fixed;left:0;top:0;height:100vh;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:15}
  main{padding:14px 12px}
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.v{font-size:22px;font-weight:650;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:22px 0 9px;font-weight:600}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:650;background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}.neg{color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:4px;height:160px;padding:12px 12px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.bar{flex:1 0 22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.bar span{font-size:10px;color:var(--mut);padding:4px 0 6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools select,.tools input{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.tools input{flex:1;min-width:160px}
.note{color:var(--mut);font-size:12.5px;margin:6px 0 12px}
.warn{background:#fef3c7;color:#92400e;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px}
iframe{width:100%;height:calc(100vh - var(--hdr,63px) - 32px);border:1px solid var(--line);border-radius:12px;background:#fff}
.srcbar{font-size:12.5px;color:var(--mut);margin:0 0 10px}
.srcbar a{color:var(--acc);font-weight:600;text-decoration:none}
.clk{cursor:pointer}
tr.clk:hover td{background:var(--soft)}
.bar.clk:hover i{opacity:.75}
.bar em{font-style:normal;font-size:9.5px;color:var(--mut);margin-bottom:2px;white-space:nowrap}
.hint{text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px;color:var(--mut)}
th.srt{cursor:pointer;user-select:none}
th.srt:hover{color:var(--acc)}
.fl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.fl input{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--txt)}
.tools .btn{padding:7px 13px;font-size:13px}
.share{display:inline-block;width:48px;height:6px;border-radius:3px;background:var(--soft);margin-right:6px;vertical-align:middle;overflow:hidden}
.share i{display:block;height:100%;background:var(--bar)}
/* brand accents: blue + green from the NCM logo */
.grid .card{border-top:3px solid var(--acc)}
.grid .card:nth-child(even){border-top-color:var(--acc2)}
main h2{color:var(--acc)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.links a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;color:inherit;text-decoration:none}
.links a:hover{border-color:var(--acc)}
</style>
</head>
<body>

<div id="lock">
  <form id="lockForm">
    <div class="lock-logo"><img src="ncm-logo.png" alt="NCM, Nuclear Concrete Mixes"></div>
    <h1>NCM Hub</h1>
    <p>Enter the hub password to view the data.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <label><input id="remember" type="checkbox" checked> Remember on this device</label>
    <button class="btn" type="submit" id="go">Open</button>
    <div id="err"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="topbar"><div class="tb"><button class="burger" id="burger" aria-label="Menu">☰</button><img src="ncm-logo.png" alt="NCM, Nuclear Concrete Mixes"><span>Plants Dashboard</span></div></div>
  </header>
  <div class="layout">
  <aside class="side" id="side">
    <nav id="tabs">
      <button data-t="plants" class="on"><i>🏭</i>Plants</button>
      <button data-t="td"><i>🧮</i>Consumption</button>
      <button data-t="cement"><i>🏗️</i>Cement</button>
      <button data-t="pour"><i>🚚</i>Pour Tracker</button>
      <button data-t="ice"><i>🧊</i>Ice Calculate</button>
      <button data-t="maintenance"><i>🔧</i>Maintenance</button>
      <button data-t="manpower"><i>👷</i>Manpower</button>
    </nav>
    <div class="side-f">
      <small id="updated"></small>
      <div class="side-b"><button class="btn ghost" id="reload" title="Reload data">↻ Reload</button>
        <button class="btn ghost" id="logout">Lock</button></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <section id="t-plants"></section>
    <section id="t-td" class="hidden"></section>
    <section id="t-cement" class="hidden"><div class="card" id="cem"></div></section>
    <section id="t-pour" class="hidden"><iframe data-src="https://hadaad11.github.io/pourtracker-/" title="Pour Tracker"></iframe></section>
    <section id="t-manpower" class="hidden"><div class="card" id="mp"></div></section>
    <section id="t-ice" class="hidden"><iframe data-src="https://elkady591.github.io/Ice-Calculator/" title="Ice Calculator"></iframe></section>
    <section id="t-maintenance" class="hidden"><div class="card" id="maint"></div></section>
  </main>
  </div>
</div>

<script src="maint.js"></script>
<script src="cement.js"></script>
<script src="manpower.js"></script>
<script>
'use strict';
// ?local=1 reads data.enc next to the page (testing on the server PC).
const DATA_URL = new URLSearchParams(location.search).has('local') ? 'data.enc'
  : 'https://raw.githubusercontent.com/hadaad11/ncm-hub/refs/heads/data/data.enc';
const KEY = 'ncm-hub-pw';
let D = null, PW = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const x = parseFloat(String(v ?? '').replace(/,/g, '')); return isNaN(x) ? null : x; };
const fmt = (v, d = 0) => { const x = num(v); return x === null ? esc(v ?? '-') : x.toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d}); };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

async function decrypt(blob, pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', hash: 'SHA-256', salt: b64(blob.salt), iterations: blob.iter},
    base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(blob.iv)}, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function fetchData(pw) {
  const r = await fetch(DATA_URL + '?t=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error('Could not download the data (' + r.status + ').');
  const blob = await r.json();
  try { return await decrypt(blob, pw); } catch (e) { throw new Error('Wrong password.'); }
}

async function open(pw, remember) {
  $('#err').textContent = ''; $('#go').disabled = true; $('#go').textContent = 'Opening…';
  try {
    D = await fetchData(pw); PW = pw;
    if (remember) store(KEY, pw);
    $('#lock').classList.add('hidden'); $('#app').classList.remove('hidden'); fitHeader();
    render();
  } catch (e) {
    $('#err').textContent = e.message; store(KEY, null);
  } finally { $('#go').disabled = false; $('#go').textContent = 'Open'; }
}

$('#lockForm').addEventListener('submit', e => { e.preventDefault(); open($('#pw').value, $('#remember').checked); });
$('#logout').onclick = () => { store(KEY, null); location.reload(); };
$('#reload').onclick = refresh;
async function refresh() { if (!PW) return; try { D = await fetchData(PW); render(); } catch (e) {} }
setInterval(refresh, 5 * 60 * 1000);

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('hidden', s.id !== 't-' + b.dataset.t));
  const f = document.querySelector('#t-' + b.dataset.t + ' iframe');
  if (f && !f.src) f.src = f.dataset.src;
  if (b.dataset.t === 'maintenance' && !$('#maint').dataset.done) { $('#maint').dataset.done = '1'; ncmMaint($('#maint')); }
  if (b.dataset.t === 'cement' && !$('#cem').dataset.done) { $('#cem').dataset.done = '1'; ncmCement($('#cem')); }
  if (b.dataset.t === 'manpower' && !$('#mp').dataset.done) { $('#mp').dataset.done = '1'; ncmManpower($('#mp')); }
  store('ncm-hub-tab', b.dataset.t);
  menu(false);
});
// phone menu
function menu(open) { $('#side').classList.toggle('open', open); $('#scrim').classList.toggle('open', open); }
$('#burger').onclick = () => menu(!$('#side').classList.contains('open'));
$('#scrim').onclick = () => menu(false);
// keep the sidebar just under the logo bar whatever its height
function fitHeader() { document.documentElement.style.setProperty('--hdr', $('header').offsetHeight + 'px'); }
addEventListener('resize', fitHeader);

function age(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 2) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60); return h < 24 ? h + ' h ago' : Math.floor(h / 24) + ' days ago';
}
const label = id => (D.plants.find(p => p.id === id) || {label: id}).label;

function render() {
  $('#updated').textContent = 'Updated ' + age(D.generated);
  renderPlants(); renderTD();
}

function kpiTotals(period) {
  const t = {del: 0, m3: 0, real: 0};
  for (const r of Object.values(D.kpi[period] || {})) { t.del += num(r[0]) || 0; t.m3 += num(r[1]) || 0; t.real += num(r[2]) || 0; }
  return t;
}

/* Date-range bar shared by Plants and Consumption: From / To + Today, This month, Last month.
   onChange(from, to) is called with YYYY-MM-DD strings. */
function rangeBar(prefix, F, onChange) {
  const min = D.from || (D.consumption || {}).from || '', max = localDay();
  const h = '<div class="tools"><label class="fl">From <input type="date" id="' + prefix + 'From" min="' + min + '" max="' + max + '" value="' + F.from + '"></label>' +
    '<label class="fl">To <input type="date" id="' + prefix + 'To" min="' + min + '" max="' + max + '" value="' + F.to + '"></label>' +
    ['today', 'month', 'last'].map(k => '<button class="btn ghost" data-' + prefix + 'rng="' + k + '">' + {today: 'Today', month: 'This month', last: 'Last month'}[k] + '</button>').join('') + '</div>';
  const wire = root => {
    root.querySelector('#' + prefix + 'From').onchange = e => onChange(e.target.value, F.to);
    root.querySelector('#' + prefix + 'To').onchange = e => onChange(F.from, e.target.value);
    root.querySelectorAll('[data-' + prefix + 'rng]').forEach(b => b.onclick = () => {
      const t = localDay(), k = b.getAttribute('data-' + prefix + 'rng');
      if (k === 'today') return onChange(t, t);
      if (k === 'month') return onChange(t.slice(0, 8) + '01', t);
      const last = localDay(new Date(+t.slice(0, 4), +t.slice(5, 7) - 1, 0));
      onChange(last.slice(0, 8) + '01', last);
    });
  };
  return {html: h, wire};
}

let PF = {from: '', to: ''};
function renderPlants() {
  const today = localDay();
  if (!PF.from) { PF.from = today.slice(0, 8) + '01'; PF.to = today; }
  const td = kpiTotals('today');
  // per plant and per day production inside the chosen range (daily report, all plants)
  const f = PF.from, t = PF.to, per = {}, days = {};
  for (const [pid, rows] of Object.entries((D.reports.gunluk || {}).rows || {}))
    for (const r of rows) {
      if (r[0] < f || r[0] > t) continue;
      const m3 = num(r[1]) || 0, n = num(r[2]) || 0;
      per[pid] = per[pid] || {m3: 0, n: 0}; per[pid].m3 += m3; per[pid].n += n;
      days[r[0]] = (days[r[0]] || 0) + m3;
    }
  const tot = Object.values(per).reduce((a, x) => ({m3: a.m3 + x.m3, n: a.n + x.n}), {m3: 0, n: 0});
  const label = f === t ? f : f + ' → ' + t;
  const stale = (Date.now() - new Date(D.generated)) > 30 * 60000;
  let h = '';
  if (stale) h += '<div class="warn">This data is more than 30 minutes old. The server PC may be off or offline.</div>';
  if (D.down && D.down.length) h += '<div class="warn">Not reachable right now: ' + esc(D.down.join(', ')) + '</div>';
  const rb = rangeBar('p', PF, (a, b) => { PF = {from: a, to: b}; renderPlants(); });
  h += rb.html;
  h += '<div class="grid">' +
    card(fmt(tot.m3, 1), 'm³ · ' + esc(label)) + card(fmt(tot.n), 'Deliveries · ' + esc(label)) +
    card(fmt(td.m3, 1), 'Today m³ (live)') + card(fmt(td.del), 'Today deliveries (live)') + '</div>';
  h += '<h2>Plants <span class="hint">· tap a plant to see its consumption</span></h2><div class="tw"><table><tr><th>Plant</th><th></th>' +
    '<th class="num">m³</th><th class="num">Deliveries</th><th class="num">Share</th><th class="num">Today m³</th><th>Last today</th></tr>';
  for (const p of D.plants) {
    const k = D.kpi.today[p.id], r = per[p.id] || {m3: 0, n: 0}, up = !!k;
    const share = tot.m3 ? r.m3 * 100 / tot.m3 : 0;
    h += '<tr class="clk" data-goplant="' + esc(p.label) + '"><td><b>' + esc(p.label) + '</b></td><td class="' + (up ? 'up">online' : 'down">offline') + '</td>' +
      '<td class="num">' + fmt(r.m3, 1) + '</td><td class="num">' + fmt(r.n) + '</td>' +
      '<td class="num"><span class="share"><i style="width:' + share.toFixed(1) + '%"></i></span>' + fmt(share, 0) + '%</td>' +
      '<td class="num">' + (k ? fmt(k[1], 1) : '-') + '</td><td>' + esc(k ? k[5] : '-') + '</td></tr>';
  }
  h += '<tfoot><tr><td>Total</td><td></td><td class="num">' + fmt(tot.m3, 1) + '</td><td class="num">' + fmt(tot.n) + '</td><td></td><td class="num">' + fmt(td.m3, 1) + '</td><td></td></tr></tfoot></table></div>';
  const keys = Object.keys(days).sort(), max = Math.max(1, ...Object.values(days));
  if (keys.length > 1) {
    h += '<h2>Daily production (m³) <span class="hint">· tap a day to see its consumption</span></h2><div class="bars">' + keys.map(k =>
      '<div class="bar clk" data-goday="' + esc(k) + '" title="' + esc(k) + ': ' + fmt(days[k], 1) + ' m³"><em>' + fmt(days[k], 0) + '</em><i style="height:' + (days[k] / max * 85).toFixed(1) + '%"></i><span>' + esc(k.slice(8)) + '</span></div>').join('') + '</div>';
  }
  if (D.problems && D.problems.length) h += '<h2>Problems</h2><div class="tw"><table>' + D.problems.map(p => '<tr><td>' + esc(p) + '</td></tr>').join('') + '</table></div>';
  const sec = $('#t-plants');
  sec.innerHTML = h;
  rb.wire(sec);
  sec.querySelectorAll('[data-goplant]').forEach(r => r.onclick = () => goConsumption({plant: r.dataset.goplant, from: PF.from, to: PF.to}));
  sec.querySelectorAll('[data-goday]').forEach(b => b.onclick = () => goConsumption({from: b.dataset.goday, to: b.dataset.goday}));
}
// YYYY-MM-DD in the viewer's local time (toISOString would give the UTC day).
const localDay = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function goConsumption(f) {
  const today = localDay();
  CF = Object.assign({plant: '', from: today.slice(0, 8) + '01', to: today, view: 'malzeme', q: ''}, f);
  CSORT = null;
  renderTD();
  document.querySelector('#tabs button[data-t="td"]').click();
  window.scrollTo(0, 0);
}
const card = (v, l) => '<div class="card"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>';

/* Consumption = the sheet's "Mix Theory vs Dry" tab, built from its Raw Data rows:
   filters Date From / To, Plant, Design Mix; one line per Standard Material with
   Mix Theory, Dry Real, Difference (Mix - Dry) and %; then the mixes with the biggest
   difference, like the daily email ("Mostly from" leaves out Water and ICE, because the
   designs count the ice inside Water). Mix Theory = m³ x kg/m³ from the "Mix Designs" tab. */
let CF = {plant: '', from: '', to: '', view: 'malzeme', q: '', mix: ''}, CSORT = null, CROWS = null;

function consRows() {           // unpack once per data load
  if (CROWS && CROWS.src === D.consumption) return CROWS.rows;
  const c = D.consumption || {}, S = c.strings || [], nt = (c.text || []).length;
  const rows = (c.rows || []).map(r => {
    const o = {GunKey: r[0], Tarih: r[0].slice(0, 4) + '-' + r[0].slice(4, 6) + '-' + r[0].slice(6, 8)};
    c.text.forEach((k, i) => o[k] = S[r[1 + i]]);
    c.num.forEach((k, i) => o[k] = r[1 + nt + i]);
    if (o.MixT === undefined) o.MixT = 0;
    return o;
  });
  CROWS = {src: D.consumption, rows};
  return rows;
}
const pct = (f, t) => t ? f * 100 / t : 0;
function m3Once(rs) { const s = {}; for (const r of rs) s[r.Santral + '|' + r.GunKey + '|' + r.Formul] = r.M3; return Object.values(s).reduce((a, b) => a + b, 0); }
function by(rs, field) { const g = new Map(); for (const r of rs) { if (!g.has(r[field])) g.set(r[field], []); g.get(r[field]).push(r); } return g; }

function renderTD() {
  const sec = $('#t-td'), all = consRows();
  if (!all.length) { sec.innerHTML = '<p class="note">No consumption data.</p>'; return; }
  const min = (D.consumption.from || all[0].Tarih), max = localDay();
  if (!CF.from) CF.from = max.slice(0, 8) + '01';
  if (!CF.to) CF.to = max;
  const plants = [...new Set(all.map(r => r.Santral))].sort();
  if (!sec.dataset.ready) {
    sec.innerHTML =
      '<div class="srcbar">Source: <a href="https://docs.google.com/spreadsheets/d/1KTGfLyml5Yk24OmU6R6Kut2MILZ-Urz4WHTfjXvMB1k/edit?gid=555000444#gid=555000444" target="_blank" rel="noopener">NCM_Material_Report · Mix Theory vs Dry (Google Sheet) ↗</a></div>' +
      '<h2 style="margin-top:4px">Mix Theory vs Dry Real</h2>' +
      '<div class="tools" id="cPlants"></div>' +
      '<div class="tools"><label class="fl">From <input type="date" id="cFrom"></label><label class="fl">To <input type="date" id="cTo"></label>' +
      '<button class="btn ghost" data-rng="today">Today</button><button class="btn ghost" data-rng="month">This month</button><button class="btn ghost" data-rng="last">Last month</button></div>' +
      '<div class="tools"><label class="fl">Design Mix <select id="cMix"></select></label><span class="note" id="cCount"></span></div>' +
      '<div class="grid" id="cKpis"></div>' +
      '<div class="tw"><table id="cTable"></table></div>' +
      '<h2>Mixes with the biggest difference</h2><div class="tw"><table id="cMixes"></table></div>' +
      '<p class="note">Mix Theory = m³ in the plant reports × the approved mix design (sheet tab "Mix Designs"). ' +
      'Difference = Mix Theory − Dry Real. ICE is in Dry Real only: the designs count it inside Water.</p>';
    sec.dataset.ready = '1';
    $('#cFrom').onchange = e => { CF.from = e.target.value; drawCons(); };
    $('#cTo').onchange = e => { CF.to = e.target.value; drawCons(); };
    $('#cMix').onchange = e => { CF.mix = e.target.value; drawCons(); };
    sec.querySelectorAll('[data-rng]').forEach(b => b.onclick = () => {
      const t = localDay();
      if (b.dataset.rng === 'today') CF.from = CF.to = t;
      else if (b.dataset.rng === 'month') { CF.from = t.slice(0, 8) + '01'; CF.to = t; }
      else { const last = new Date(+t.slice(0, 4), +t.slice(5, 7) - 1, 0); CF.to = localDay(last); CF.from = CF.to.slice(0, 8) + '01'; }
      drawCons();
    });
  }
  $('#cPlants').innerHTML = ['', ...plants].map(p => '<button class="btn' + (p === CF.plant ? '' : ' ghost') + '" data-cp="' + esc(p) + '">' + (p ? esc(p) : 'All plants') + '</button>').join('');
  $('#cPlants').querySelectorAll('[data-cp]').forEach(b => b.onclick = () => { CF.plant = b.dataset.cp; renderTD(); });
  ['cFrom', 'cTo'].forEach(id => { $('#' + id).min = min; $('#' + id).max = max; });
  drawCons();
}

function drawCons() {
  $('#cFrom').value = CF.from; $('#cTo').value = CF.to;
  const from = CF.from.replace(/-/g, ''), to = CF.to.replace(/-/g, '');
  const inRange = consRows().filter(r => (!CF.plant || r.Santral === CF.plant) && r.GunKey >= from && r.GunKey <= to);
  // Design Mix list follows the plant + dates, like the sheet's dropdown
  const mixes = [...new Set(inRange.map(r => r.StdFormul))].sort();
  if (CF.mix && !mixes.includes(CF.mix)) CF.mix = '';
  $('#cMix').innerHTML = '<option value="">All</option>' + mixes.map(m => '<option' + (m === CF.mix ? ' selected' : '') + '>' + esc(m) + '</option>').join('');
  const rs = inRange.filter(r => !CF.mix || r.StdFormul === CF.mix);
  const sum = (xs, k) => xs.reduce((a, r) => a + (r[k] || 0), 0);
  const mt = sum(rs, 'MixT'), dry = sum(rs, 'Kuru'), diff = mt - dry;
  const sign = (v, d) => '<span class="' + (v < 0 ? 'neg' : '') + '">' + (v > 0 ? '+' : '') + fmt(v, d) + '</span>';
  $('#cKpis').innerHTML = card(fmt(m3Once(rs), 1), 'Concrete m³') + card(fmt(mt), 'Mix Theory kg') + card(fmt(dry), 'Dry Real kg') +
    card(sign(diff, 0), 'Difference (Mix − Dry)') + card(sign(pct(diff, mt), 2) + ' %', 'Difference %');
  // one line per Standard Material (all materials seen in the period, like the sheet)
  const mats = [...new Set(inRange.map(r => r.StdMalzeme))].sort((a, b) => a.localeCompare(b));
  const g = by(rs, 'StdMalzeme');
  const lines = mats.map(m => { const xs = g.get(m) || []; const a = sum(xs, 'MixT'), b = sum(xs, 'Kuru'); return {m, a, b, d: a - b}; });
  const dcell = (v, d) => '<td class="num' + (v < 0 ? ' neg' : '') + '">' + (v > 0 ? '+' : '') + fmt(v, d) + '</td>';
  $('#cTable').innerHTML = '<tr><th>No.</th><th>Standard Material</th><th class="num">Mix Theory QTY</th><th class="num">Dry Real QTY</th><th class="num">Difference (Mix − Dry)</th><th class="num">Difference %</th></tr>' +
    lines.map((x, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(x.m) + '</td><td class="num">' + fmt(x.a, 2) + '</td><td class="num">' + fmt(x.b, 2) + '</td>' +
      dcell(x.d, 2) + (x.a ? dcell(pct(x.d, x.a), 2).replace('</td>', ' %</td>') : '<td class="num"></td>') + '</tr>').join('') +
    '<tfoot><tr><td></td><td>GRAND TOTAL</td><td class="num">' + fmt(mt, 2) + '</td><td class="num">' + fmt(dry, 2) + '</td>' + dcell(diff, 2) +
    dcell(pct(diff, mt), 2).replace('</td>', ' %</td>') + '</tr></tfoot>';
  // mixes with the biggest difference (top 5), "mostly from" = biggest material difference without Water / ICE
  const top = [...by(rs, 'StdFormul')].map(([f, xs]) => {
    const a = sum(xs, 'MixT'), d = a - sum(xs, 'Kuru');
    const per = [...by(xs.filter(r => !/^(water|ice)$/i.test(r.StdMalzeme)), 'StdMalzeme')].map(([m, ys]) => [m, sum(ys, 'MixT') - sum(ys, 'Kuru')])
      .sort((p, q) => Math.abs(q[1]) - Math.abs(p[1]))[0] || ['', 0];
    return {f, d, p: pct(d, a), mm: per[0], md: per[1]};
  }).sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 5);
  $('#cMixes').innerHTML = '<tr><th>Design Mix</th><th class="num">Difference</th><th class="num">%</th><th>Mostly from</th></tr>' +
    (top.length ? top.map(x => '<tr class="clk" data-cmix="' + esc(x.f) + '"><td>' + esc(x.f) + '</td>' + dcell(x.d, 0) + dcell(x.p, 2).replace('</td>', ' %</td>') +
      '<td>' + esc(x.mm) + ' <span class="' + (x.md < 0 ? 'neg' : '') + '">' + (x.md > 0 ? '+' : '') + fmt(x.md, 0) + '</span></td></tr>').join('')
      : '<tr><td colspan="4" class="note">No production in this range.</td></tr>');
  $('#cMixes').querySelectorAll('[data-cmix]').forEach(tr => tr.onclick = () => { CF.mix = tr.dataset.cmix; drawCons(); window.scrollTo(0, 0); });
  $('#cCount').textContent = CF.from + ' → ' + CF.to + (CF.plant ? ' · ' + CF.plant : ' · all plants') + (CF.mix ? ' · ' + CF.mix : '');
}

// restore last tab + saved password
const savedTab = load('ncm-hub-tab');
const saved = load(KEY);
if (saved) open(saved, true);
if (savedTab) setTimeout(() => { const b = document.querySelector('#tabs button[data-t="' + savedTab + '"]'); if (b) b.click(); }, 0);
</script>
