<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCM Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040912;--panel:rgba(10,22,40,.78);--line:rgba(120,170,255,.16);--txt:#dbe7f7;--mut:#7f93ad;
  --ok:#2ff59a;--slow:#ffcc3d;--down:#ff3d5a;--blue:#2f8cff;--green:#24a854}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:12px 18px;z-index:3;
  background:linear-gradient(180deg,rgba(4,9,18,.95),rgba(4,9,18,0))}
.top img{height:30px;background:#fff;border-radius:7px;padding:3px 6px}
.top h1{font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.top h1 span{color:var(--ok);text-shadow:0 0 12px var(--ok)}
.top .sp{flex:1}
.pill{font:600 12px 'JetBrains Mono',monospace;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.pill b.ok{color:var(--ok)}.pill b.slow{color:var(--slow)}.pill b.down{color:var(--down)}
button.fs{font:600 12px Inter;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer}
.side{position:fixed;right:14px;top:62px;bottom:14px;width:320px;display:flex;flex-direction:column;gap:12px;z-index:3;overflow:auto;scrollbar-width:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;backdrop-filter:blur(10px)}
.card h3{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.m{display:flex;justify-content:space-between;font:500 12.5px 'JetBrains Mono',monospace;margin:7px 0 4px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--ok));box-shadow:0 0 10px var(--ok);transition:width .6s}
.bar i.hot{background:linear-gradient(90deg,var(--slow),var(--down));box-shadow:0 0 10px var(--down)}
.al{font-size:12px;padding:7px 0;border-top:1px solid var(--line)}.al:first-of-type{border-top:0}
.al small{display:block;color:var(--mut);font:500 10.5px 'JetBrains Mono',monospace}
.pred{font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)}.pred:first-of-type{border-top:0}
.pred b{color:var(--slow)}
#tip{position:fixed;z-index:4;pointer-events:none;background:rgba(8,18,34,.95);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  font-size:12.5px;min-width:190px;display:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#tip b{font-size:14px}#tip .s{font:700 11px 'JetBrains Mono',monospace;text-transform:uppercase}
#tip .r{color:var(--mut);font:500 11.5px 'JetBrains Mono',monospace;margin-top:4px}
.legend{position:fixed;left:16px;bottom:14px;z-index:3;display:flex;gap:14px;font:600 11.5px Inter;color:var(--mut)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:3px;vertical-align:middle;margin-right:6px}
@media (max-width:820px){
  html,body{overflow:auto}
  #c{position:relative;height:62vh}
  .side{position:relative;right:auto;top:auto;bottom:auto;width:auto;margin:0 10px 18px;overflow:visible}
  .legend{position:relative;left:auto;bottom:auto;margin:6px 12px 10px;flex-wrap:wrap}
  .top{position:relative;background:none}
}
</style>
</head>
<body>
<div class="top"><img src="ncm-logo.png" alt="NCM"><h1>NCM <span>Monitor</span></h1><span class="sp"></span>
  <span class="pill" id="sum">…</span><span class="pill" id="clock">--:--:--</span><a class="fs" id="live" href="http://192.168.1.128:8812" target="_blank" rel="noopener" style="text-decoration:none">⚡ Live</a><button class="fs" id="fs">⛶ Full screen</button></div>
<canvas id="c"></canvas>
<div class="side">
  <div class="card" id="srv"><h3>Server</h3></div>
  <div class="card" id="pred"><h3>Forecast</h3></div>
  <div class="card" id="alerts"><h3>Alerts</h3></div>
</div>
<div class="legend"><span><i style="background:var(--ok)"></i>OK</span><span><i style="background:var(--slow)"></i>Slow</span><span><i style="background:var(--down)"></i>Down</span></div>
<div id="tip"></div>
<script>
'use strict';
const COL = {ok: '#2ff59a', slow: '#ffcc3d', down: '#ff3d5a', none: '#4a5d78'};
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let S = {nodes: {}, links: [], server: {}, alerts: []}, W = 0, H = 0, DPR = 1, pos = {}, parts = [], hover = null;

function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); const r = cv.getBoundingClientRect();
  W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); layout();
}
addEventListener('resize', resize);

// layout: server in the middle, services around it, plant PCs on an arc with their DB further out
function layout() {
  const side = W > 820 ? 340 : 0, cw = W - side, mx = cw / 2, my = H / 2 + 10, R = Math.min(cw, H) * .34;
  pos = {server: [mx, my]};
  const ring = (ids, a0, a1, rr) => ids.forEach((id, i) => { const a = a0 + (a1 - a0) * (ids.length === 1 ? .5 : i / (ids.length - 1)); pos[id] = [mx + Math.cos(a) * rr, my + Math.sin(a) * rr]; });
  ring(['tailscale', 'internet', 'hub'], -2.5, -1.2, R * .78);
  ring(['portal', 'mail', 'manpower'], -.75, .45, R * .78);
  pos.app = [mx - R * .55, my + R * .25];
  const pcs = Object.keys(S.nodes).filter(k => k.startsWith('pc_')).sort();
  pcs.forEach((id, i) => {
    const a = 1.75 + (pcs.length === 1 ? 0 : (i / (pcs.length - 1) - .5) * 1.9), cxp = pos.app[0], cyp = pos.app[1];
    pos[id] = [cxp + Math.cos(a) * R * .72, cyp + Math.sin(a) * R * .72];
    pos['db_' + id.slice(3)] = [cxp + Math.cos(a) * R * 1.08, cyp + Math.sin(a) * R * 1.08];
  });
  if (W <= 820) { // phone: keep everything inside
    Object.keys(pos).forEach(k => { pos[k][0] = Math.max(34, Math.min(W - 34, pos[k][0])); pos[k][1] = Math.max(40, Math.min(H - 30, pos[k][1])); });
  }
}

function linkStatus(a, b) {
  const sa = (S.nodes[a] || {}).status, sb = (S.nodes[b] || {}).status;
  if (sa === 'down' || sb === 'down') return 'down';
  if (sa === 'slow' || sb === 'slow') return 'slow';
  return sa && sb ? 'ok' : 'none';
}

// signal particles travel along the healthy links
function spawn() {
  for (const l of S.links) {
    const st = linkStatus(l.a, l.b);
    if (st === 'down' || st === 'none' || !pos[l.a] || !pos[l.b]) continue;
    const want = st === 'ok' ? 3 : 1;
    const have = parts.filter(p => p.l === l).length;
    if (have < want && Math.random() < .08) parts.push({l, t: 0, v: (st === 'ok' ? .006 : .0025) * (.7 + Math.random() * .6), back: Math.random() < .35});
  }
}

function drawNode(id, n, t) {
  const p = pos[id]; if (!p) return;
  const st = n.status || 'none', c = COL[st], big = id === 'server', r = big ? 30 : n.kind === 'db' ? 13 : n.kind === 'plant' ? 19 : 16;
  const pulse = st === 'down' ? (Math.sin(t / 180) + 1) / 2 : (Math.sin(t / 900 + p[0]) + 1) / 2;
  cx.save();
  cx.shadowColor = c; cx.shadowBlur = big ? 40 : 22 + pulse * 14;
  cx.fillStyle = 'rgba(6,14,28,.95)'; cx.strokeStyle = c; cx.lineWidth = big ? 3 : 2;
  cx.beginPath(); cx.arc(p[0], p[1], r, 0, 7); cx.fill(); cx.stroke();
  cx.globalAlpha = .25 + pulse * .35; cx.beginPath(); cx.arc(p[0], p[1], r + 6 + pulse * 5, 0, 7); cx.stroke(); cx.globalAlpha = 1;
  cx.shadowBlur = 0; cx.fillStyle = c;
  cx.beginPath(); cx.arc(p[0], p[1], big ? 7 : 4, 0, 7); cx.fill();
  cx.font = (big ? '800 13px' : '700 11.5px') + ' Inter'; cx.textAlign = 'center'; cx.fillStyle = '#dbe7f7';
  cx.fillText(n.label || id, p[0], p[1] + r + 16);
  cx.font = '500 10px "JetBrains Mono"'; cx.fillStyle = st === 'down' ? COL.down : '#7f93ad';
  const sub = st === 'down' ? 'DOWN' : (n.latency ? n.latency + ' ms' : (id === 'server' ? `CPU ${Math.round((S.server || {}).cpu || 0)}%` : ''));
  if (sub) cx.fillText(sub, p[0], p[1] + r + 29);
  cx.restore();
}

function frame(t) {
  cx.clearRect(0, 0, W, H);
  // faint grid
  cx.strokeStyle = 'rgba(80,130,220,.05)'; cx.lineWidth = 1;
  for (let x = (t / 60) % 40; x < W; x += 40) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke(); }
  for (let y = 0; y < H; y += 40) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); }
  // links
  for (const l of S.links) {
    const a = pos[l.a], b = pos[l.b]; if (!a || !b) continue;
    const st = linkStatus(l.a, l.b), c = COL[st];
    cx.save(); cx.strokeStyle = c; cx.lineWidth = st === 'down' ? 1.6 : 2; cx.globalAlpha = st === 'down' ? .75 : .35;
    cx.shadowColor = c; cx.shadowBlur = st === 'down' ? 6 : 12;
    if (st === 'down') cx.setLineDash([6, 7]);
    cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.stroke(); cx.restore();
  }
  // particles
  spawn();
  parts = parts.filter(p => (p.t += p.v) < 1 && linkStatus(p.l.a, p.l.b) !== 'down');
  for (const p of parts) {
    const a = pos[p.l.a], b = pos[p.l.b]; if (!a || !b) continue;
    const k = p.back ? 1 - p.t : p.t, x = a[0] + (b[0] - a[0]) * k, y = a[1] + (b[1] - a[1]) * k, c = COL[linkStatus(p.l.a, p.l.b)];
    cx.save(); cx.fillStyle = c; cx.shadowColor = c; cx.shadowBlur = 16;
    cx.beginPath(); cx.arc(x, y, 2.6, 0, 7); cx.fill();
    cx.globalAlpha = .35; const kx = (p.back ? -1 : 1) * (b[0] - a[0]) * .025, ky = (p.back ? -1 : 1) * (b[1] - a[1]) * .025;
    cx.beginPath(); cx.arc(x - kx, y - ky, 1.8, 0, 7); cx.fill(); cx.restore();
  }
  for (const [id, n] of Object.entries(S.nodes)) drawNode(id, n, t);
  requestAnimationFrame(frame);
}

// tooltip on hover / tap
function nodeAt(x, y) { let best = null, d0 = 34; for (const [id, p] of Object.entries(pos)) { const d = Math.hypot(p[0] - x, p[1] - y); if (d < d0 && S.nodes[id]) { d0 = d; best = id; } } return best; }
function showTip(e) {
  const r = cv.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX), y = (e.touches ? e.touches[0].clientY : e.clientY);
  const id = nodeAt(x - r.left, y - r.top), tip = document.getElementById('tip');
  if (!id) { tip.style.display = 'none'; return; }
  const n = S.nodes[id], ago = n.last_ok ? Math.round(S.now - n.last_ok) : null;
  tip.innerHTML = `<b>${n.label}</b> <span class="s" style="color:${COL[n.status]}">${n.status}</span>` +
    `<div class="r">${n.detail || ''}</div>` + (n.host ? `<div class="r">${n.host}</div>` : '') +
    `<div class="r">last answer: ${ago === null ? 'never' : ago < 60 ? ago + ' s ago' : Math.round(ago / 60) + ' min ago'}</div>`;
  tip.style.display = 'block'; tip.style.left = Math.min(innerWidth - 230, x + 14) + 'px'; tip.style.top = (y + 14) + 'px';
}
cv.addEventListener('mousemove', showTip); cv.addEventListener('touchstart', showTip, {passive: true});
cv.addEventListener('mouseleave', () => document.getElementById('tip').style.display = 'none');

const bar = (pct) => `<div class="bar"><i class="${pct > 85 ? 'hot' : ''}" style="width:${Math.min(100, pct)}%"></i></div>`;
function panels() {
  const s = S.server || {};
  let h = `<h3>Server · ${s.host || ''}</h3>` +
    `<div class="m"><span>CPU</span><span>${Math.round(s.cpu || 0)}%</span></div>${bar(s.cpu || 0)}` +
    `<div class="m"><span>RAM</span><span>${s.ram_used_gb || 0} / ${s.ram_total_gb || 0} GB</span></div>${bar(s.ram_pct || 0)}`;
  (s.disks || []).forEach(d => { h += `<div class="m"><span>Disk ${d.drive}</span><span>${d.free_gb} GB free</span></div>${bar(d.used_pct)}`; });
  h += `<div class="m" style="color:#7f93ad"><span>Uptime</span><span>${s.uptime_h || 0} h</span></div>`;
  document.getElementById('srv').innerHTML = h;
  // forecast: simple trends from the last 24 h
  const pr = [];
  (s.disks || []).forEach(d => { if (d.full_in_days !== null && d.full_in_days < 60) pr.push(`Disk <b>${d.drive}</b> full in about <b>${d.full_in_days} days</b>`); });
  if (s.ram_trend_per_day && s.ram_trend_per_day > 5) pr.push(`RAM use rising <b>+${s.ram_trend_per_day.toFixed(1)}%/day</b>`);
  Object.values(S.nodes).filter(n => n.kind === 'plant' && n.ping_trend && n.ping_trend > 40).forEach(n => pr.push(`${n.label}: replies getting slower <b>+${Math.round(n.ping_trend)} ms/day</b>`));
  document.getElementById('pred').innerHTML = '<h3>Forecast</h3>' + (pr.length ? pr.map(x => `<div class="pred">${x}</div>`).join('') :
    '<div class="pred" style="color:#7f93ad">No risk seen in the last 24 h.</div>');
  const al = (S.alerts || []).slice(0, 12);
  document.getElementById('alerts').innerHTML = '<h3>Alerts' + (S.telegram ? ' · Telegram on' : ' · Telegram not set') + '</h3>' +
    (al.length ? al.map(a => `<div class="al">${a.text}<small>${new Date(a.t * 1000).toLocaleString('en-GB')}</small></div>`).join('') : '<div class="al" style="color:#7f93ad">No alerts.</div>');
  const ns = Object.values(S.nodes), c = k => ns.filter(n => n.status === k).length;
  document.getElementById('sum').innerHTML = `<b class="ok">${c('ok')} OK</b> · <b class="slow">${c('slow')} slow</b> · <b class="down">${c('down')} down</b>`;
}

// Inside the NCM Hub this page is a snapshot sent by the server every 5 minutes (parent.D.monitor);
// the live version (every 10 s) is on the server itself: http://192.168.1.128:8812 or http://100.73.12.26:8812
async function getStatus() {
  try { const m = window.parent && window.parent !== window && window.parent.HUB && window.parent.HUB.monitor; if (m && m.nodes) return Object.assign({snapshot: true}, m); } catch (e) {}
  const r = await fetch('status.json', {cache: 'no-store'}); return r.json();
}
async function poll() {
  try {
    const j = await getStatus();
    if (j.snapshot) document.getElementById('clock').textContent = 'snapshot ' + new Date(j.now * 1000).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
    const fresh = Object.keys(j.nodes).length !== Object.keys(S.nodes).length; S = j; if (fresh) layout(); panels();
  } catch (e) { document.getElementById('sum').innerHTML = '<b class="down">monitor not answering</b>'; }
}
setInterval(poll, 3000); poll();
setInterval(() => { if (!S.snapshot) document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
